services:

  # ── Frontend Flutter Web (servido por nginx) ─────────────────────────────────
  # Conecta al backend desplegado en Render (datos reales de Neon).
  # REQUISITO: ejecuta modoA_presentacion.bat antes de levantar esto por primera vez.
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend_flutter/build/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro