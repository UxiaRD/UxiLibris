name: frontend_flutter
description: "Uxilibris: Gestión bibliográfica personal con personalización."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  provider: ^6.1.5+1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  image_picker: ^1.1.2

flutter:
  uses-material-design: true

  assets:
  - assets/images/
  - assets/images/fondos/

# Configuración de iconos de la app
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icono.png"
  adaptive_icon_background: "#ffffff" # Recomendado para Android moderno
  adaptive_icon_foreground: "assets/images/icono.png"
