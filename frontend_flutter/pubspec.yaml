name: frontend_flutter
description: "Uxilibris: Gestión bibliográfica personal con personalización."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.1.0
  http: ^1.6.0
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  path_provider: ^2.1.2
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
  - assets/images/
  - assets/images/fondos/
  - assets/images/ilustraciones/

  fonts:
    - family: MontserratAlternates
      fonts:
        - asset: assets/fonts/Montserrat_Alternates/MontserratAlternates-Regular.ttf
        - asset: assets/fonts/Montserrat_Alternates/MontserratAlternates-Bold.ttf
          weight: 700

# Configuración de iconos de la app
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icono.png"
  adaptive_icon_background: "#ffffff" # Recomendado para Android moderno
  adaptive_icon_foreground: "assets/images/icono.png"
