services:
  - type: web
    name: uxilibris-backend
    runtime: docker
    dockerfilePath: ./backend_spring/uxilibris-backend/Dockerfile
    dockerContext: ./backend_spring/uxilibris-backend
    plan: free
    envVars:
      # Las tres variables de conexión se configuran manualmente en el dashboard de Render
      # con las credenciales de Neon (Project → Connection Details)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false