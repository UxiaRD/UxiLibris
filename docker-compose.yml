services:

  # ── Base de datos MySQL ──────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-UxiLibrisDB}
    volumes:
      - mysql_data:/var/lib/mysql   # los datos persisten entre reinicios
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── Backend Spring Boot ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend_spring/uxilibris-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-UxiLibrisDB}?createDatabaseIfNotExists=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure  # reintenta si MySQL aún no está listo

  # ── Frontend Flutter Web (servido por nginx) ─────────────────────────────────
  # REQUISITO: ejecuta "flutter build web --release" en frontend_flutter/ antes
  # de levantar el compose. Los ficheros generados en build/web/ son los que sirve nginx.
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend_flutter/build/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data: