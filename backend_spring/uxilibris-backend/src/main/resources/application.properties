spring.application.name=uxilibris-backend
# Si el puerto 8080 está ocupado, cámbialo aquí (ej. 8081)
#server.port=3306

# --- 2. BASE DE DATOS (H2 en memoria) ---
spring.datasource.url=jdbc:mysql://localhost:3306/UxiLibrisDB?createDatabaseIfNotExists=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=abc123.

# --- 3. JPA / HIBERNATE ---
# 'update' crea las tablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update
# Muestra y formatea las consultas SQL por la consola del IDE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false